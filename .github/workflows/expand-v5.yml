name: Expand existing V5

on:
  push:
    branches: [main]
    paths: ['.github/workflows/expand-v5.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          try_zip() {
            name="$1"; shift
            echo "Trying $name"
            cat "$@" | tr -d '\r\n' | base64 -d > /tmp/candidate.zip || return 1
            unzip -t /tmp/candidate.zip >/dev/null 2>&1 || return 1
            rm -rf /tmp/out/*
            unzip -q /tmp/candidate.zip -d /tmp/out
            echo "$name" > /tmp/source-set.txt
            return 0
          }
          try_zip v5-000 deploy/v5/part_000.b64 deploy/v5/part_001.b64 deploy/v5/part_002.b64 deploy/v5/part_003.b64 deploy/v5/part_004.b64 deploy/v5/part_005.b64 deploy/v5/part_006.b64 deploy/v5/part_007.b64 deploy/v5/part_008.b64 || \
          try_zip v5-00 deploy/v5/part_00.b64 deploy/v5/part_01.b64 || \
          try_zip chunks deploy/chunks/part_00.b64 deploy/chunks/part_01.b64 deploy/chunks/part_02.b64 deploy/chunks/part_03.b64 deploy/chunks/part_04.b64 || \
          try_zip release deploy/release/part_00.b64 deploy/release/part_01.b64 deploy/release/part_02.b64 deploy/release/part_03.b64 deploy/release/part_04.b64 || \
          { echo 'No valid archive set'; exit 1; }
          echo "Recovered: $(cat /tmp/source-set.txt)"
      - name: Publish recovered tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CPA Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git switch --orphan expanded-v5
          git rm -rf . >/dev/null 2>&1 || true
          shopt -s dotglob nullglob
          entries=(/tmp/out/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}/." .
          else
            cp -a /tmp/out/. .
          fi
          git add -A
          git commit -m 'Recover expanded V5 source'
          git push --force origin expanded-v5
